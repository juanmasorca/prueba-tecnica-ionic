<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalog"></ion-back-button>
    </ion-buttons>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-input
        type="email"
        label="Email"
        labelPlacement="stacked"
        formControlName="email"
        autocomplete="email"
      ></ion-input>
    </ion-item>
    <p class="error" *ngIf="submitted && form.controls.email.invalid">
      Ingresa un email válido.
    </p>

    <ion-item class="password-item">
      <ion-input
        type="password"
        label="Contraseña"
        labelPlacement="stacked"
        formControlName="password"
        autocomplete="current-password"
        errorText=""
      ></ion-input>
    </ion-item>
    <p class="hint" *ngIf="submitted && form.controls.password.invalid">
      La contraseña es obligatoria.
    </p>

    <ion-button class="ion-margin-top" expand="block" type="submit">Entrar</ion-button>
  </form>

  <p class="link">
    ¿No tienes cuenta?
    <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }">Regístrate</a>
  </p>
</ion-content>
